
name: Publier ITIVARO sur GitHub Pages

# Déploiement automatique à chaque modification de main
# Déploiement manuel également possible depuis GitHub Actions
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Autorisations nécessaires pour GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Évite plusieurs déploiements simultanés
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Vérifier et publier ITIVARO
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. Récupérer le code du dépôt
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      # 2. Préparer Node.js
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 3. Vérifier les fichiers du projet
      - name: Vérifier ITIVARO
        run: npm run check

      # 4. Configurer GitHub Pages
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      # 5. Préparer le site Web
      - name: Préparer les fichiers publics
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      # 6. Publier le site
      - name: Déployer ITIVARO
        id: deployment
        uses: actions/deploy-pages@v4
